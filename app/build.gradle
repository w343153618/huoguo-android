apply plugin: 'com.android.application'

// Test-only package override for isolated probe installs that preserve formal app data.
def probeApplicationId = project.findProperty('probeApplicationId')
if (project.hasProperty('probeApplicationId') && probeApplicationId != 'local.remoteandroid.direct.experiment') {
    throw new GradleException('probeApplicationId only accepts local.remoteandroid.direct.experiment')
}

android {
    namespace 'local.remoteandroid.direct'
    compileSdk 37
    defaultConfig {
        applicationId(probeApplicationId == null ? 'local.remoteandroid.direct' : probeApplicationId)
        minSdk 30
        targetSdk 37
        versionCode 30
        versionName '1.29'
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', '"' + (project.findProperty('updateManifestUrl') ?: 'https://146.56.249.175:15556/updates/update.json').replace('"', '') + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        distribution {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig System.getenv('ANDROID_KEYSTORE_FILE') ? signingConfigs.distribution : signingConfigs.debug; minifyEnabled false } }
}
