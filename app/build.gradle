apply plugin: 'com.android.application'

// Test-only package override for isolated probe installs that preserve formal app data.
def probeApplicationId = project.findProperty('probeApplicationId')
if (project.hasProperty('probeApplicationId') && probeApplicationId != 'local.remoteandroid.direct.experiment') {
    throw new GradleException('probeApplicationId only accepts local.remoteandroid.direct.experiment')
}

def authenticatedLanUdp = project.findProperty('authenticatedLanUdp') == 'true'
if (authenticatedLanUdp && probeApplicationId != 'local.remoteandroid.direct.experiment') {
    throw new GradleException('authenticatedLanUdp requires isolated probeApplicationId')
}
def experimentalVersionName = project.findProperty('experimentalVersionName')
def experimentalVersionCode = project.findProperty('experimentalVersionCode')
// Only the isolated UDP variant has a candidate default. The formal package
// and explicitly pinned historical UDP versions retain separate identities.
if (authenticatedLanUdp && experimentalVersionName == null && experimentalVersionCode == null) {
    experimentalVersionName = '1.31-alpha.8'
    experimentalVersionCode = '39'
}
if ((experimentalVersionName == null) != (experimentalVersionCode == null)) {
    throw new GradleException('Experimental version name and code must be provided together')
}
if ((experimentalVersionName != null || experimentalVersionCode != null) && !authenticatedLanUdp) {
    throw new GradleException('Experimental versions require the isolated authenticated UDP build')
}
if (experimentalVersionName != null && !(experimentalVersionName ==~ /[0-9]+\.[0-9]+(?:\.[0-9]+)?-[A-Za-z0-9]+(?:\.[A-Za-z0-9]+)*/)) {
    throw new GradleException('Invalid experimental version name')
}
if (experimentalVersionCode != null && (!(experimentalVersionCode ==~ /[1-9][0-9]{0,8}/))) {
    throw new GradleException('Invalid experimental version code')
}

android {
    namespace 'local.remoteandroid.direct'
    compileSdk 37
    defaultConfig {
        applicationId(probeApplicationId == null ? 'local.remoteandroid.direct' : probeApplicationId)
        minSdk 30
        targetSdk 37
        versionCode 32
        versionName '1.31'
        if (authenticatedLanUdp && experimentalVersionName != null && experimentalVersionCode != null) {
            versionName experimentalVersionName
            versionCode experimentalVersionCode.toInteger()
        }
        manifestPlaceholders = [appLabel: authenticatedLanUdp ? '给火锅的安卓 · 实验版' : '@string/app_name',
            appIcon: authenticatedLanUdp ? '@mipmap/ic_launcher_experimental' : '@mipmap/ic_launcher',
            appTheme: authenticatedLanUdp ? '@style/HuoguoExperimentalTheme' : '@android:style/Theme.Material.Light.NoActionBar']
        buildConfigField 'String', 'RELEASE_CHANNEL', authenticatedLanUdp ? '"experimental"' : '"formal"'
        buildConfigField 'boolean', 'AUTHENTICATED_LAN_UDP', authenticatedLanUdp ? 'true' : 'false'
        if (authenticatedLanUdp) { ndk { abiFilters 'arm64-v8a' } }
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', '"' + (project.findProperty('updateManifestUrl') ?: (authenticatedLanUdp ? 'https://146.56.249.175:15556/experimental/experiment.json' : 'https://146.56.249.175:15556/updates/update.json')).replace('"', '') + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        distribution {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig System.getenv('ANDROID_KEYSTORE_FILE') ? signingConfigs.distribution : signingConfigs.debug; minifyEnabled false } }
}

// This source/JNI set is absent from every formal build.
if (authenticatedLanUdp) {
    def generatedJava = layout.buildDirectory.dir('generated/udpCandidateJava')
    def generatedJni = layout.buildDirectory.dir('generated/udpCandidateJni')
    android.sourceSets.main.java.srcDirs += ['src/udp/java', generatedJava.get().asFile]
    android.sourceSets.main.res.srcDirs += ['src/udp/res']
    android.sourceSets.main.jniLibs.srcDir generatedJni.get().asFile
    def generateUdpCandidateJava = tasks.register('generateUdpCandidateJava', Copy) {
        from(rootProject.file('experiments/nps-transport/phone')) {
            include 'UdpVideoProbe.java', 'UdpVideoSecurity.java', 'NativeUdpFec.java',
                    'UdpAudioAssembler.java', 'UdpAudioReceiver.java', 'BoundedPcmQueue.java', 'UdpTouchControl.java',
                    'CodecFileProbe.java', 'FramedH264Fixture.java', 'CodecStartupGate.java'
        }
        into(generatedJava.map { it.dir('local/remoteandroid/direct') })
    }
    def buildUdpCandidateNative = tasks.register('buildUdpCandidateNative', Exec) {
        commandLine 'python3', rootProject.file('experiments/moonlight-v2/transport/android-udp/build.py'),
                '--android', '--build', layout.buildDirectory.dir('udpCandidateNative').get().asFile
    }
    def packageUdpCandidateNative = tasks.register('packageUdpCandidateNative', Copy) {
        dependsOn buildUdpCandidateNative
        from(layout.buildDirectory.file('udpCandidateNative/android-arm64/libhuoguo_udp_fec.so'))
        into(generatedJni.map { it.dir('arm64-v8a') })
    }
    tasks.named('preBuild').configure { dependsOn generateUdpCandidateJava, packageUdpCandidateNative }
}
