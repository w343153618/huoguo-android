name: Android build verification
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Compile and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Check gateway syntax and endpoint parser
        run: |
          python3 -m py_compile gateway.py lan_interfaces.py add-user.py scripts/*.py
          mkdir -p /tmp/endpoint-check
          javac -d /tmp/endpoint-check app/src/main/java/local/remoteandroid/direct/Endpoint.java tests/EndpointCheck.java
          java -cp /tmp/endpoint-check local.remoteandroid.direct.EndpointCheck
# This job never publishes its temporary CI-signed APK. Upgrade signing stays on the owner's Mac.
